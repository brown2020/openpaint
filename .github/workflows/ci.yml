name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "REDACTED_BY_HISTORY_PURGE"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "openpaint.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "openpaint"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "openpaint.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1037035818109"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1037035818109:web:643bbd3996fe747a0c7514"
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-WGT8GWXLCY"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
